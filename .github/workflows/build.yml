name: Report App pipeline
run-name: app
on:
  push:
    branch: "main"
    paths-ignore: "terraform/**"
jobs:
  build-and-docker:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Tests and Build JAR
        run: mvn clean package
        #output:
         # my_value: "${{steps.id.genarete.example file}}"
         # steps:
          #    id: generate
           #   run: echo "${{example file}}" >> $github_output
      -  name: Log in to Docker Hub
         uses: docker/login-action@v3
         with:
           username: ${{ secrets.DOCKERHUB_USERNAME }}
           password: ${{ secrets.DOCKERHUB_TOKEN}}

      - name: Build Docker image
        run: docker build -t my-report-app:latest .
      - name: Tag image for registry
        run: docker tag my-report-app:latest bindhup/report-app:latest

      - name: Push Docker image
        run: docker push bindhup/report-app:latest
