name: Report App pipeline
run-name: app
on:
  push:
    branch: "main"
jobs:
  build-and-docker:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run Tests and Build JAR
        run: mvn clean package

      - name: Build Docker Image
        run: docker build -t my-report-app:latest .
