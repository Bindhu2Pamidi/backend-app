name: Report App pipeline
run-name: app
on:
  push:
    branch: "main"
    paths-ignore: "terraform/**"
jobs:
  build-and-docker:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Tests and Build JAR
        run: mvn clean package

      -  name: Log in to Docker Hub
         uses: docker/login-action@v3
         with:
           username: bindhup
           password: ${{ secrets.DOCKERHUB_TOKEN}}

      - name: Build Docker image
        run: docker build -t report-app-docker:latest .

      - name: Tag image for registry
        run: docker tag report-app-docker:latest bindhup/report-app-testing:latest

      - name: Push Docker image
        run: docker push bindhup/report-app-testing:latest
