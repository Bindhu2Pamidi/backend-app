name: Report App pipeline
run-name: app
on:
  push:
    branch: "main"
jobs:
  build-and-docker:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Tests and Build JAR
        run: mvn clean package
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "bindhup" --password-stdin

      - name: Build Docker image
        run: docker build -t my-report-app:latest .
      - name: Tag image for registry
        run: docker tag my-report-app:latest bindhup/report-app:latest

      - name: Push Docker image
        run: docker push bindhup/report-app:latest
