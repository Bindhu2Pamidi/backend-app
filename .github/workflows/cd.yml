name: Terraform CD

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
  workflow_run:
    workflows: ["Report App pipeline"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:


env:
  AWS_REGION: us-east-1

jobs:
  terraform-deploy:
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && !contains(github.event.head_commit.modified, 'app/'))

    container:
      image: docker.io/bindhup/report-app-testing:latest
      credentials:
        username: bindhup
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure S3 Backend Bucket Exists
        run: |
          BUCKET_NAME="report-s3-bucket"
            if ! aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
              echo "Bucket $BUCKET_NAME does not exist. Creating it now..."
              aws s3api create-bucket --bucket "$BUCKET_NAME" --region ${{ env.AWS_REGION }}
              aws s3api put-bucket-versioning --bucket "$BUCKET_NAME" --versioning-configuration Status=Enabled
            else
              echo "Bucket $BUCKET_NAME already exists. Skipping creation."
            fi

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate


      - name: Terraform plan
        run: terraform plan -out=tfplan
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

      - name: Force ECS deployment
        run: |
          aws ecs update-service \
            --cluster report-app-test-cluster \
            --service report-app-test \
            --force-new-deployment

      - name: Print application URL
        run: terraform output application_url
